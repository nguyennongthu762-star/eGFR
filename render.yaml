# Blueprint Render: chỉ một dịch vụ API (Docker), không cần cơ sở dữ liệu. Frontend triển khai riêng trên Vercel.
services:
  - type: web
    name: ckd-api
    runtime: docker
    rootDir: backend
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        sync: false   # đặt = URL frontend trên Vercel, vd https://ckd-app.vercel.app
